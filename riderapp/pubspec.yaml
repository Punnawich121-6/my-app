name: riderapp
description: "Zest & Savory Rider App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  http: ^1.2.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shared_preferences: ^2.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.0
  socket_io_client: ^2.0.3
  image_picker: ^1.1.2
  image: ^4.2.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  audioplayers: ^6.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/top-income-of-food-delivery-riders-1.jpg
